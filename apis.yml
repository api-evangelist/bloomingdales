description: >-
  Bloomingdale's is an American luxury department store chain and a
  subsidiary of Macy's, Inc. Bloomingdale's does not publish a public
  developer portal; partner integration is delivered through the parent
  Macy's Inc. vendor and trade partner programs, drop-ship and EDI channels
  with suppliers, the Bloomingdale's affiliate program for marketing
  partners, and the shared Macy's Inc. technology platform powering
  Bloomingdale's commerce, loyalty, and fulfillment.
